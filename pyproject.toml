# Tool settings only: dependencies are pinned in requirements.txt / requirements-dev.txt (README).
# Function size is gated separately by scripts/code_metrics.py (80 lines / complexity 20).
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# the base rule set of every repository (devtools README): pyflakes, the pycodestyle errors that are bugs or
# hide statements, whitespace, import order. Complexity is gated by scripts/code_metrics.py, not by C90.
# Line length (E501) is not enforced: wide characters count double in ruff and most long lines are Chinese text.
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.code-metrics]
# what scripts/code_metrics.py measures (that script is the same file in every repository)
paths = ["planner"]
