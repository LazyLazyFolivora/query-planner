# Tool settings only: dependencies are pinned in requirements.txt / requirements-dev.txt (README).
# Function size is gated separately by scripts/code_metrics.py (80 lines / complexity 20).
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, the pycodestyle errors that are bugs or hide statements, whitespace, import order, McCabe. Line length
# (E501) is not enforced: wide characters count double in ruff and most long lines are Chinese text.
select = ["E4", "E7", "E9", "F", "W", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 20
